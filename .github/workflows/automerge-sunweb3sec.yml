name: Auto-merge SunWeb3Sec PRs

# Only PRs authored by the SunWeb3Sec account are auto-merged. PRs from
# anyone else are left untouched for manual review.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to (re-)process'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'SunWeb3Sec'
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify PR author is SunWeb3Sec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          AUTHOR=$(gh pr view "$PR" --repo "${{ github.repository }}" --json author --jq '.author.login')
          echo "PR #$PR author: $AUTHOR"
          if [ "$AUTHOR" != "SunWeb3Sec" ]; then
            echo "Author is not SunWeb3Sec — skipping auto-merge."
            exit 1
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head

      - name: Sanity-check JSON data files
        run: |
          for f in incidents.json rootcause_data.json; do
            if [ -f "$f" ]; then
              python3 -m json.tool "$f" > /dev/null
              echo "$f: valid JSON"
            fi
          done

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR" --repo "${{ github.repository }}" --auto --squash
